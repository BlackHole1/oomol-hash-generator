executor:
  name: python
  options:
    entry: __init__.py
inputs_def:
  - handle: input
    description: "Text string to generate hash values from. Enter any text content."
    json_schema:
      type: string
    value: ""
  - handle: lowercased
    description: "Whether to output hash values in lowercase format. When false,
      outputs uppercase."
    json_schema:
      type: boolean
    value: false
outputs_def:
  - handle: MD5
    description: "MD5 hash value of the input string (32 characters)"
    json_schema:
      type: string
  - handle: SHA1
    description: "SHA-1 hash value of the input string (40 characters)"
    json_schema:
      type: string
  - handle: SHA224
    description: "SHA-224 hash value of the input string (56 characters)"
    json_schema:
      type: string
  - handle: SHA256
    description: "SHA-256 hash value of the input string (64 characters)"
    json_schema:
      type: string
  - handle: SHA384
    description: "SHA-384 hash value of the input string (96 characters)"
    json_schema:
      type: string
  - handle: SHA512
    description: "SHA-512 hash value of the input string (128 characters)"
    json_schema:
      type: string
title: Hash Generator With String
icon: ":carbon:security:"
description: "Generate multiple hash values (MD5, SHA-1, SHA-224, SHA-256,
  SHA-384, SHA-512) from text input. Perfect for password hashing, data
  verification, and creating unique identifiers. Text is UTF-8 encoded before
  processing."
